<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今天有没有想周周">
<title>今天有没有想周周 🐷</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fff5f7 0%,#fce7f0 20%,#fbcfe8 45%,#f9a8d4 70%,#f472b6 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }

  /* floating "周周很想你" text */
  .float-text{
    position:absolute;font-size:16px;color:rgba(255,255,255,.7);
    font-weight:700;pointer-events:none;
    animation:floatTextUp 10s linear infinite;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }
  @keyframes floatTextUp{
    0%{transform:translateY(100vh) translateX(0) rotate(-5deg);opacity:0}
    10%{opacity:.7}
    50%{transform:translateY(50vh) translateX(20px) rotate(5deg);opacity:.6}
    90%{opacity:.4}
    100%{transform:translateY(-100px) translateX(-10px) rotate(-3deg);opacity:0}
  }
  .heart-bg{position:absolute;font-size:20px;opacity:.35;animation:floatUp 9s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }

  .title{
    font-size:24px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 12px rgba(236,72,153,.4);
    margin-bottom:6px;z-index:2;letter-spacing:2px;
  }
  .subtitle{
    font-size:14px;color:rgba(255,255,255,.9);margin-bottom:20px;z-index:2;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }

  .pig-container{
    position:relative;z-index:2;margin-bottom:30px;
    animation:idle 3s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes idle{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-4px) rotate(1deg)}
    75%{transform:translateY(-4px) rotate(-1deg)}
  }
  .pig-container.happy{animation:happyShake .4s ease 4}
  @keyframes happyShake{
    0%,100%{transform:translateX(0) rotate(0) scale(1)}
    25%{transform:translateX(-15px) rotate(-8deg) scale(1.06)}
    75%{transform:translateX(15px) rotate(8deg) scale(1.06)}
  }
  .pig-svg{width:220px;height:200px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}

  /* ears wiggle */
  #earLeft{transform-origin:78px 78px;animation:earWiggleL 2.5s ease-in-out infinite}
  @keyframes earWiggleL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
  #earRight{transform-origin:142px 78px;animation:earWiggleR 2.5s ease-in-out infinite}
  @keyframes earWiggleR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
  .pig-container.happy #earLeft{animation:earFastL .25s ease infinite}
  @keyframes earFastL{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(8deg)}}
  .pig-container.happy #earRight{animation:earFastR .25s ease infinite}
  @keyframes earFastR{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-8deg)}}

  /* tail wag (curly pig tail) */
  #pigTail{transform-origin:175px 130px;animation:tailWag 1.8s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(20deg)}}
  .pig-container.happy #pigTail{animation:tailFast .2s ease infinite}
  @keyframes tailFast{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(40deg)}}

  .miss-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;
    padding:16px 52px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(236,72,153,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .counter{
    margin-top:18px;font-size:13px;color:rgba(255,255,255,.85);
    z-index:2;text-shadow:0 1px 4px rgba(236,72,153,.3);
  }

  .popup-overlay{
    position:fixed;inset:0;background:rgba(131,24,67,.25);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#fdf2f8);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(236,72,153,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #fbcfe8;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:20px;font-weight:800;color:#ec4899;margin-bottom:10px}
  .popup-text{font-size:15px;color:#9d174d;line-height:1.6;margin-bottom:8px}
  .popup-sub{font-size:13px;color:#be185d;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(236,72,153,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}

  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }
  .footer{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.6);z-index:2}
</style>
</head>
<body>
<div id="floatTextBg"></div>
<div id="heartsBg"></div>

<div class="title">今天有没有想周周</div>
<div class="subtitle">🐷 点点小猪告诉它你想它啦～</div>

<div class="pig-container" id="pigContainer" onclick="petPig()">
  <svg class="pig-svg" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
    <!-- curly tail -->
    <g id="pigTail">
      <path d="M175 130 Q190 120 185 105 Q180 95 190 90 Q200 88 198 98" 
        stroke="#f9a8d4" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M175 130 Q190 120 185 105 Q180 95 190 90 Q200 88 198 98" 
        stroke="#fbcfe8" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- ears -->
    <g id="earLeft">
      <path d="M78 78 L60 55 L88 68 Z" fill="#f9a8d4" stroke="#f472b6" stroke-width="1.5"/>
      <path d="M76 73 L67 62 L82 69 Z" fill="#fbcfe8"/>
    </g>
    <g id="earRight">
      <path d="M142 78 L160 55 L132 68 Z" fill="#f9a8d4" stroke="#f472b6" stroke-width="1.5"/>
      <path d="M144 73 L153 62 L138 69 Z" fill="#fbcfe8"/>
    </g>

    <!-- body (round) -->
    <ellipse cx="110" cy="140" rx="60" ry="45" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>
    <ellipse cx="110" cy="145" rx="45" ry="32" fill="#fbcfe8" opacity=".5"/>

    <!-- feet -->
    <ellipse cx="80" cy="180" rx="13" ry="8" fill="#f9a8d4" stroke="#f472b6" stroke-width="1.2"/>
    <ellipse cx="140" cy="180" rx="13" ry="8" fill="#f9a8d4" stroke="#f472b6" stroke-width="1.2"/>
    <!-- hoof details -->
    <line x1="76" y1="178" x2="84" y2="178" stroke="#ec4899" stroke-width="1.5"/>
    <line x1="136" y1="178" x2="144" y2="178" stroke="#ec4899" stroke-width="1.5"/>

    <!-- arms -->
    <ellipse cx="65" cy="135" rx="11" ry="15" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.2" transform="rotate(-20 65 135)"/>
    <ellipse cx="155" cy="135" rx="11" ry="15" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.2" transform="rotate(20 155 135)"/>

    <!-- head (big round) -->
    <circle cx="110" cy="95" r="50" fill="#fce7f3" stroke="#f472b6" stroke-width="1.5"/>

    <!-- snout (pig nose!) -->
    <ellipse cx="110" cy="108" rx="22" ry="16" fill="#f9a8d4" stroke="#f472b6" stroke-width="1.5"/>
    <ellipse cx="103" cy="108" rx="4" ry="6" fill="#9d174d" opacity=".4"/>
    <ellipse cx="117" cy="108" rx="4" ry="6" fill="#9d174d" opacity=".4"/>

    <!-- eyes normal -->
    <g id="eyesNormal">
      <ellipse cx="90" cy="88" rx="5" ry="7" fill="#1f2937"/>
      <ellipse cx="130" cy="88" rx="5" ry="7" fill="#1f2937"/>
      <circle cx="92" cy="85" r="2" fill="#fff"/>
      <circle cx="132" cy="85" r="2" fill="#fff"/>
    </g>
    <!-- happy eyes -->
    <g id="eyesHappy" style="display:none">
      <path d="M84 89 Q90 82 96 89" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M124 89 Q130 82 136 89" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="75" cy="100" rx="9" ry="6" fill="#fb7185" opacity=".4"/>
    <ellipse cx="145" cy="100" rx="9" ry="6" fill="#fb7185" opacity=".4"/>

    <!-- mouth normal (under snout) -->
    <path id="mouthNormal" d="M102 125 Q110 130 118 125" stroke="#9d174d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- happy mouth -->
    <path id="mouthHappy" d="M98 124 Q110 136 122 124 Q117 132 110 132 Q103 132 98 124" fill="#fb7185" stroke="#9d174d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>

    <!-- flower on head -->
    <g id="headFlower">
      <circle cx="82" cy="55" r="6" fill="#fbbf24"/>
      <circle cx="76" cy="49" r="4" fill="#fff"/>
      <circle cx="88" cy="49" r="4" fill="#fff"/>
      <circle cx="76" cy="61" r="4" fill="#fff"/>
      <circle cx="88" cy="61" r="4" fill="#fff"/>
    </g>

    <!-- heart on body -->
    <text x="100" y="150" font-size="16">💕</text>

    <ellipse id="tongue" cx="110" cy="130" rx="3" ry="2" fill="#fb7185" style="display:none"/>
  </svg>
</div>

<button class="miss-btn" onclick="missPig()">
  <span class="btn-heart">💗</span>想了
</button>

<div class="counter" id="counter">今天想了 0 次</div>

<div class="footer"> made with 💕 for 你 & 周周 </div>

<!-- popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-emoji">🐷💗</div>
    <div class="popup-title">周周也超级想你！</div>
    <div class="popup-text">小猪说：<br>"哼哼～收到你的想念啦！<br>摇摇尾巴动动耳朵，周周也一直在想你哦！"</div>
    <div class="popup-sub">🌸 心意已传达 🌸</div>
    <button class="popup-btn" onclick="closePopup()">好开心哼哼～</button>
  </div>
</div>

<script>
let count=Number(localStorage.getItem('zzMissCount')||0);
let lastDate=localStorage.getItem('zzMissDate')||'';
const today=new Date().toDateString();
if(lastDate!==today){count=0;localStorage.setItem('zzMissDate',today)}
updateCounter();

function updateCounter(){
  document.getElementById('counter').textContent='今天想了 '+count+' 次';
}

function missPig(){
  count++;
  localStorage.setItem('zzMissCount',count);
  updateCounter();
  makeHappy();
  createSparkles();
  setTimeout(()=>{document.getElementById('popupOverlay').classList.add('show')},350);
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(resetFace,300);
}

function petPig(){
  makeHappy();
  createSparkles();
}

let happyTimer=null;
function makeHappy(){
  const pig=document.getElementById('pigContainer');
  pig.classList.add('happy');
  document.getElementById('eyesNormal').style.display='none';
  document.getElementById('eyesHappy').style.display='';
  document.getElementById('mouthNormal').style.display='none';
  document.getElementById('mouthHappy').style.display='';
  document.getElementById('tongue').style.display='';
  clearTimeout(happyTimer);
  happyTimer=setTimeout(()=>{
    pig.classList.remove('happy');
    if(!document.getElementById('popupOverlay').classList.contains('show'))resetFace();
  },2000);
}
function resetFace(){
  document.getElementById('eyesNormal').style.display='';
  document.getElementById('eyesHappy').style.display='none';
  document.getElementById('mouthNormal').style.display='';
  document.getElementById('mouthHappy').style.display='none';
  document.getElementById('tongue').style.display='none';
}

function createSparkles(){
  const emojis=['💗','✨','💖','🌸','💫','🐷','💕','🌷'];
  const pig=document.getElementById('pigContainer');
  const rect=pig.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*180)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*120)+'px';
    s.style.animationDelay=(i*0.07)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

// floating hearts
function createFloatingHeart(){
  const h=document.createElement('div');
  h.className='heart-bg';
  const emojis=['💗','💕','✨','🌸','💫','🐷','🌷'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';
  h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);
  setTimeout(()=>h.remove(),10000);
}

// floating "周周很想你" text
function createFloatText(){
  const t=document.createElement('div');
  t.className='float-text';
  const phrases=['周周很想你 💕','周周也很想你 🌸','想周周了 💗','周周周周~ 🐷','哼哼 想你 ✨'];
  t.textContent=phrases[Math.floor(Math.random()*phrases.length)];
  t.style.left=Math.random()*80+'%';
  t.style.fontSize=(13+Math.random()*8)+'px';
  t.style.animationDuration=(8+Math.random()*5)+'s';
  document.getElementById('floatTextBg').appendChild(t);
  setTimeout(()=>t.remove(),13000);
}

setInterval(createFloatingHeart,650);
setInterval(createFloatText,1500);
for(let i=0;i<5;i++){setTimeout(createFloatingHeart,i*200);setTimeout(createFloatText,i*800)}
</script>
</body>
</html>
