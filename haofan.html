<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="好饭好饭我是小羊">
<title>好饭好饭，我是小羊 🐑</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fdf2f8 0%,#fce7f3 20%,#fbcfe8 45%,#f9a8d4 70%,#f472b6 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  .heart-bg{position:absolute;font-size:20px;opacity:.35;animation:floatUp 9s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }
  .flower-bg{position:absolute;font-size:18px;opacity:.25;animation:floatFlower 14s linear infinite;pointer-events:none}
  @keyframes floatFlower{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.25}
    90%{opacity:.2}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }

  .title{
    font-size:24px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 12px rgba(236,72,153,.4);
    margin-bottom:6px;z-index:2;letter-spacing:1px;
  }
  .subtitle{
    font-size:13px;color:rgba(255,255,255,.9);margin-bottom:24px;z-index:2;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }

  .sheep-container{
    position:relative;z-index:2;margin-bottom:32px;
    animation:idle 3s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes idle{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
  }
  .sheep-container.happy{animation:happyJump .55s ease 3}
  @keyframes happyJump{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-26px) rotate(-7deg) scale(1.05)}
    75%{transform:translateY(-26px) rotate(7deg) scale(1.05)}
  }
  .sheep-svg{width:210px;height:210px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}

  /* tail wag */
  #sheepTail{transform-origin:165px 135px;animation:wag 1.8s ease-in-out infinite}
  @keyframes wag{
    0%,100%{transform:rotate(-10deg)}
    50%{transform:rotate(15deg)}
  }
  .sheep-container.happy #sheepTail{animation:wagFast .28s ease infinite}
  @keyframes wagFast{
    0%,100%{transform:rotate(-28deg)}
    50%{transform:rotate(32deg)}
  }

  .miss-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;
    padding:16px 50px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(236,72,153,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .counter{
    margin-top:18px;font-size:13px;color:rgba(255,255,255,.85);
    z-index:2;text-shadow:0 1px 4px rgba(236,72,153,.3);
  }

  .popup-overlay{
    position:fixed;inset:0;background:rgba(131,24,67,.25);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#fdf2f8);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(236,72,153,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #fbcfe8;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:20px;font-weight:800;color:#ec4899;margin-bottom:10px}
  .popup-text{font-size:15px;color:#9d174d;line-height:1.6;margin-bottom:8px}
  .popup-sub{font-size:13px;color:#be185d;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(236,72,153,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}

  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }
  .footer{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.6);z-index:2}
</style>
</head>
<body>
<div id="heartsBg"></div>
<div id="flowersBg"></div>

<div class="title">好饭好饭，我是小羊</div>
<div class="subtitle">🐑 点点小羊告诉它你想它啦～</div>

<div class="sheep-container" id="sheepContainer" onclick="petSheep()">
  <svg class="sheep-svg" id="sheepSvg" viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">
    <!-- tail -->
    <g id="sheepTail">
      <circle cx="168" cy="138" r="11" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
      <circle cx="168" cy="138" r="6" fill="#fbcfe8"/>
    </g>

    <!-- fluffy body (cloud puffs) -->
    <ellipse cx="105" cy="145" rx="60" ry="45" fill="#fff"/>
    <circle cx="58" cy="128" r="22" fill="#fff"/>
    <circle cx="152" cy="128" r="22" fill="#fff"/>
    <circle cx="88" cy="100" r="26" fill="#fff"/>
    <circle cx="130" cy="100" r="24" fill="#fff"/>
    <circle cx="105" cy="92" r="24" fill="#fff"/>

    <!-- legs -->
    <rect x="78" y="178" width="11" height="24" rx="5" fill="#d1d5db"/>
    <rect x="121" y="178" width="11" height="24" rx="5" fill="#d1d5db"/>
    <rect x="95" y="182" width="10" height="20" rx="4" fill="#e5e7eb"/>
    <rect x="107" y="182" width="10" height="20" rx="4" fill="#e5e7eb"/>

    <!-- face -->
    <ellipse cx="105" cy="118" rx="32" ry="29" fill="#fce7f3"/>
    <!-- ears -->
    <ellipse cx="76" cy="102" rx="11" ry="7" fill="#f9a8d4" transform="rotate(-30 76 102)"/>
    <ellipse cx="134" cy="102" rx="11" ry="7" fill="#f9a8d4" transform="rotate(30 134 102)"/>
    <ellipse cx="76" cy="102" rx="6" ry="3.5" fill="#fbcfe8" transform="rotate(-30 76 102)"/>
    <ellipse cx="134" cy="102" rx="6" ry="3.5" fill="#fbcfe8" transform="rotate(30 134 102)"/>

    <!-- eyes normal -->
    <g id="eyesNormal">
      <ellipse cx="94" cy="116" rx="5" ry="6.5" fill="#1f2937"/>
      <ellipse cx="116" cy="116" rx="5" ry="6.5" fill="#1f2937"/>
      <circle cx="96" cy="113" r="2.2" fill="#fff"/>
      <circle cx="118" cy="113" r="2.2" fill="#fff"/>
    </g>
    <!-- eyes happy -->
    <g id="eyesHappy" style="display:none">
      <path d="M88 117 Q94 110 100 117" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M110 117 Q116 110 122 117" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="82" cy="128" rx="8" ry="5" fill="#fb7185" opacity=".5"/>
    <ellipse cx="128" cy="128" rx="8" ry="5" fill="#fb7185" opacity=".5"/>

    <!-- nose -->
    <ellipse cx="105" cy="126" rx="4" ry="3" fill="#ec4899"/>

    <!-- mouth normal -->
    <path id="mouthNormal" d="M99 131 Q105 136 111 131" stroke="#9d174d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- mouth happy -->
    <path id="mouthHappy" d="M97 129 Q105 139 113 129 Q108 135 105 135 Q102 135 97 129" fill="#fb7185" stroke="#9d174d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>

    <!-- tuft on top -->
    <circle cx="105" cy="88" r="8" fill="#fff"/>

    <!-- bow on head -->
    <path d="M92 84 L80 76 L80 92 Z" fill="#ec4899"/>
    <path d="M92 84 L104 76 L104 92 Z" fill="#ec4899"/>
    <circle cx="92" cy="84" r="4.5" fill="#be185d"/>
    <circle cx="92" cy="84" r="1.8" fill="#fbcfe8"/>

    <!-- flower on body -->
    <text x="130" y="155" font-size="16">🌸</text>

    <!-- sparkles -->
    <circle cx="70" cy="145" r="2.5" fill="#fff" opacity=".6"/>
    <circle cx="140" cy="150" r="2" fill="#fff" opacity=".5"/>
  </svg>
</div>

<button class="miss-btn" onclick="missSheep()">
  <span class="btn-heart">💗</span>想了
</button>

<div class="counter" id="counter">今天想了 0 次</div>

<div class="footer"> made with 💕 for 你 & 小羊 </div>

<!-- popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-emoji">🐑💗</div>
    <div class="popup-title">小羊也超级想你！</div>
    <div class="popup-text">小羊说：<br>"咩～收到你的想念啦！<br>摇摇尾巴，我也一直想你哦！"</div>
    <div class="popup-sub">🌸 心意已传达 🌸</div>
    <button class="popup-btn" onclick="closePopup()">好开心咩～</button>
  </div>
</div>

<script>
let count=Number(localStorage.getItem('hfSheepMissCount')||0);
let lastDate=localStorage.getItem('hfSheepMissDate')||'';
const today=new Date().toDateString();
if(lastDate!==today){count=0;localStorage.setItem('hfSheepMissDate',today)}
updateCounter();

function updateCounter(){
  document.getElementById('counter').textContent='今天想了 '+count+' 次';
}

function missSheep(){
  count++;
  localStorage.setItem('hfSheepMissCount',count);
  updateCounter();
  makeHappy();
  createSparkles();
  setTimeout(()=>{document.getElementById('popupOverlay').classList.add('show')},350);
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(resetFace,300);
}

function petSheep(){
  makeHappy();
  createSparkles();
}

let happyTimer=null;
function makeHappy(){
  const sheep=document.getElementById('sheepContainer');
  sheep.classList.add('happy');
  document.getElementById('eyesNormal').style.display='none';
  document.getElementById('eyesHappy').style.display='';
  document.getElementById('mouthNormal').style.display='none';
  document.getElementById('mouthHappy').style.display='';
  clearTimeout(happyTimer);
  happyTimer=setTimeout(()=>{
    sheep.classList.remove('happy');
    if(!document.getElementById('popupOverlay').classList.contains('show'))resetFace();
  },2000);
}
function resetFace(){
  document.getElementById('eyesNormal').style.display='';
  document.getElementById('eyesHappy').style.display='none';
  document.getElementById('mouthNormal').style.display='';
  document.getElementById('mouthHappy').style.display='none';
}

function createSparkles(){
  const emojis=['💗','✨','💖','🌸','💫','🐑','💕','🌷'];
  const sheep=document.getElementById('sheepContainer');
  const rect=sheep.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*170)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*110)+'px';
    s.style.animationDelay=(i*0.07)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

function createFloatingHeart(){
  const h=document.createElement('div');
  h.className='heart-bg';
  const emojis=['💗','💕','✨','🌸','💫','🐑','🌷'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';
  h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);
  setTimeout(()=>h.remove(),10000);
}

function createFloatingFlower(){
  const f=document.createElement('div');
  f.className='flower-bg';
  f.textContent='🌸';
  f.style.left=Math.random()*100+'%';
  f.style.fontSize=(12+Math.random()*10)+'px';
  f.style.animationDuration=(10+Math.random()*6)+'s';
  document.getElementById('flowersBg').appendChild(f);
  setTimeout(()=>f.remove(),16000);
}

setInterval(createFloatingHeart,650);
setInterval(createFloatingFlower,1000);
for(let i=0;i<5;i++){setTimeout(createFloatingHeart,i*200);setTimeout(createFloatingFlower,i*400)}
</script>
</body>
</html>
