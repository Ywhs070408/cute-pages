<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天有没有想秋香鱼">
<title>今天有没有想秋香鱼 🐟</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#e0f2fe 0%,#bae6fd 20%,#7dd3fc 45%,#38bdf8 70%,#0ea5e9 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  .heart-bg{position:absolute;font-size:20px;opacity:.35;animation:floatUp 9s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }
  .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);pointer-events:none;animation:bubbleUp 7s linear infinite}
  @keyframes bubbleUp{
    0%{transform:translateY(0) scale(.4);opacity:0}
    15%{opacity:.7}
    100%{transform:translateY(-100vh) scale(1.2);opacity:0}
  }

  .title{
    font-size:23px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 12px rgba(14,165,233,.4);
    margin-bottom:6px;z-index:2;letter-spacing:1px;
  }
  .subtitle{
    font-size:13px;color:rgba(255,255,255,.9);margin-bottom:24px;z-index:2;
    text-shadow:0 1px 6px rgba(14,165,233,.3);
  }

  .fish-container{
    position:relative;z-index:2;margin-bottom:32px;
    animation:swim 3.5s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes swim{
    0%,100%{transform:translateX(-12px) translateY(0)}
    33%{transform:translateX(8px) translateY(-8px)}
    66%{transform:translateX(12px) translateY(4px)}
  }
  .fish-container.happy{animation:happyShake .5s ease 3}
  @keyframes happyShake{
    0%,100%{transform:translateX(0) rotate(0) scale(1)}
    25%{transform:translateX(-16px) rotate(-8deg) scale(1.06)}
    75%{transform:translateX(16px) rotate(8deg) scale(1.06)}
  }
  .fish-svg{width:230px;height:180px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}

  /* tail wag */
  #fishTail{transform-origin:160px 90px;animation:wag 1.6s ease-in-out infinite}
  @keyframes wag{
    0%,100%{transform:rotate(-12deg)}
    50%{transform:rotate(15deg)}
  }
  .fish-container.happy #fishTail{animation:wagFast .22s ease infinite}
  @keyframes wagFast{
    0%,100%{transform:rotate(-30deg)}
    50%{transform:rotate(35deg)}
  }

  .miss-btn{
    background:linear-gradient(135deg,#38bdf8,#0284c7);
    color:#fff;border:none;
    padding:16px 50px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(2,132,199,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .counter{
    margin-top:18px;font-size:13px;color:rgba(255,255,255,.85);
    z-index:2;text-shadow:0 1px 4px rgba(2,132,199,.3);
  }

  .popup-overlay{
    position:fixed;inset:0;background:rgba(7,89,133,.25);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#f0f9ff);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(2,132,199,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #bae6fd;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:20px;font-weight:800;color:#0284c7;margin-bottom:10px}
  .popup-text{font-size:15px;color:#075985;line-height:1.6;margin-bottom:8px}
  .popup-sub{font-size:13px;color:#0369a1;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#38bdf8,#0284c7);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(2,132,199,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}

  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }
  .footer{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.6);z-index:2}
</style>
</head>
<body>
<div id="heartsBg"></div>
<div id="bubblesBg"></div>

<div class="title">今天有没有想秋香鱼</div>
<div class="subtitle">🐟 点点小鱼告诉它你想它啦～</div>

<div class="fish-container" id="fishContainer" onclick="petFish()">
  <svg class="fish-svg" viewBox="0 0 230 180" xmlns="http://www.w3.org/2000/svg">
    <!-- tail -->
    <g id="fishTail">
      <path d="M160 90 L210 50 L198 90 L210 130 Z" fill="#0ea5e9"/>
      <path d="M160 90 L205 65 L196 90 L205 115 Z" fill="#7dd3fc"/>
    </g>

    <!-- body main -->
    <ellipse cx="95" cy="90" rx="68" ry="45" fill="#38bdf8"/>
    <!-- body lighter top -->
    <ellipse cx="95" cy="75" rx="58" ry="30" fill="#7dd3fc"/>
    <!-- belly -->
    <ellipse cx="95" cy="108" rx="50" ry="28" fill="#e0f2fe"/>

    <!-- top fin -->
    <path d="M85 48 Q95 15 110 25 Q115 35 112 48 Z" fill="#0284c7"/>
    <path d="M90 48 Q97 28 107 32 Q110 40 108 48 Z" fill="#38bdf8"/>
    <!-- bottom fin -->
    <path d="M90 132 Q80 150 95 148 Q100 142 100 134 Z" fill="#0284c7"/>
    <!-- side fin -->
    <path d="M110 105 Q95 130 80 122 Q85 115 105 108 Z" fill="#0ea5e9"/>

    <!-- face area -->
    <ellipse cx="50" cy="85" rx="28" ry="25" fill="#7dd3fc"/>

    <!-- eyes normal -->
    <g id="eyesNormal">
      <ellipse cx="45" cy="78" rx="6" ry="8" fill="#0c4a6e"/>
      <ellipse cx="70" cy="78" rx="6" ry="8" fill="#0c4a6e"/>
      <circle cx="47" cy="75" r="2.5" fill="#fff"/>
      <circle cx="72" cy="75" r="2.5" fill="#fff"/>
    </g>
    <!-- eyes happy -->
    <g id="eyesHappy" style="display:none">
      <path d="M38 80 Q45 72 52 80" stroke="#0c4a6e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M63 80 Q70 72 77 80" stroke="#0c4a6e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="35" cy="95" rx="8" ry="5" fill="#fb7185" opacity=".45"/>
    <ellipse cx="80" cy="95" rx="8" ry="5" fill="#fb7185" opacity=".45"/>

    <!-- mouth normal -->
    <path id="mouthNormal" d="M50 98 Q57 103 64 98" stroke="#075985" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- mouth happy -->
    <path id="mouthHappy" d="M45 96 Q57 112 69 96 Q64 104 57 104 Q50 104 45 96" fill="#fb7185" stroke="#075985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>

    <!-- scales decoration -->
    <path d="M105 70 Q112 78 105 86" stroke="#0284c7" stroke-width="1.5" fill="none" opacity=".5"/>
    <path d="M118 72 Q125 80 118 88" stroke="#0284c7" stroke-width="1.5" fill="none" opacity=".5"/>
    <path d="M131 74 Q138 82 131 90" stroke="#0284c7" stroke-width="1.5" fill="none" opacity=".5"/>

    <!-- water sparkles on body -->
    <circle cx="100" cy="65" r="3" fill="#fff" opacity=".7"/>
    <circle cx="120" cy="78" r="2" fill="#fff" opacity=".6"/>
    <circle cx="110" cy="100" r="2.5" fill="#fff" opacity=".5"/>

    <!-- bow on head -->
    <path d="M95 42 L83 34 L83 50 Z" fill="#ec4899"/>
    <path d="M95 42 L107 34 L107 50 Z" fill="#ec4899"/>
    <circle cx="95" cy="42" r="4.5" fill="#be185d"/>
    <circle cx="95" cy="42" r="1.8" fill="#fbcfe8"/>

    <!-- heart on body -->
    <text x="130" y="115" font-size="14" fill="#fb7185" opacity=".7">💕</text>
  </svg>
</div>

<button class="miss-btn" onclick="missFish()">
  <span class="btn-heart">💙</span>想了
</button>

<div class="counter" id="counter">今天想了 0 次</div>

<div class="footer"> made with 💙 for 你 & 秋香鱼 </div>

<!-- popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-emoji">🐟💙</div>
    <div class="popup-title">秋香鱼也超级想你！</div>
    <div class="popup-text">小鱼说：<br>"咕噜咕噜～收到你的想念啦！<br>摇摇尾巴，我也一直想你哦！"</div>
    <div class="popup-sub">🫧 心意已传达 🫧</div>
    <button class="popup-btn" onclick="closePopup()">好开心呀～</button>
  </div>
</div>

<script>
let count=Number(localStorage.getItem('qxFishMissCount')||0);
let lastDate=localStorage.getItem('qxFishMissDate')||'';
const today=new Date().toDateString();
if(lastDate!==today){count=0;localStorage.setItem('qxFishMissDate',today)}
updateCounter();

function updateCounter(){
  document.getElementById('counter').textContent='今天想了 '+count+' 次';
}

function missFish(){
  count++;
  localStorage.setItem('qxFishMissCount',count);
  updateCounter();
  makeHappy();
  createSparkles();
  createBubbles();
  setTimeout(()=>{document.getElementById('popupOverlay').classList.add('show')},350);
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(resetFace,300);
}

function petFish(){
  makeHappy();
  createSparkles();
  createBubbles();
}

let happyTimer=null;
function makeHappy(){
  const fish=document.getElementById('fishContainer');
  fish.classList.add('happy');
  document.getElementById('eyesNormal').style.display='none';
  document.getElementById('eyesHappy').style.display='';
  document.getElementById('mouthNormal').style.display='none';
  document.getElementById('mouthHappy').style.display='';
  clearTimeout(happyTimer);
  happyTimer=setTimeout(()=>{
    fish.classList.remove('happy');
    if(!document.getElementById('popupOverlay').classList.contains('show'))resetFace();
  },2000);
}
function resetFace(){
  document.getElementById('eyesNormal').style.display='';
  document.getElementById('eyesHappy').style.display='none';
  document.getElementById('mouthNormal').style.display='';
  document.getElementById('mouthHappy').style.display='none';
}

function createSparkles(){
  const emojis=['💙','✨','💖','🫧','💫','🐟','💕'];
  const fish=document.getElementById('fishContainer');
  const rect=fish.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*170)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*110)+'px';
    s.style.animationDelay=(i*0.07)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

function createBubbles(){
  const fish=document.getElementById('fishContainer');
  const rect=fish.getBoundingClientRect();
  for(let i=0;i<7;i++){
    const b=document.createElement('div');
    b.className='sparkle';
    b.textContent='🫧';
    b.style.fontSize=(16+Math.random()*14)+'px';
    b.style.left=(rect.left+Math.random()*rect.width)+'px';
    b.style.top=(rect.bottom-10)+'px';
    b.style.animationDelay=(i*0.09)+'s';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),1500);
  }
}

function createFloatingHeart(){
  const h=document.createElement('div');
  h.className='heart-bg';
  const emojis=['💙','💕','✨','🫧','💫','🐟'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';
  h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);
  setTimeout(()=>h.remove(),10000);
}

function createBgBubble(){
  const b=document.createElement('div');
  b.className='bubble';
  const size=8+Math.random()*22;
  b.style.width=size+'px';
  b.style.height=size+'px';
  b.style.left=Math.random()*100+'%';
  b.style.bottom='0';
  b.style.animationDuration=(4+Math.random()*5)+'s';
  document.getElementById('bubblesBg').appendChild(b);
  setTimeout(()=>b.remove(),9000);
}

setInterval(createFloatingHeart,700);
setInterval(createBgBubble,500);
for(let i=0;i<5;i++){setTimeout(createFloatingHeart,i*200);setTimeout(createBgBubble,i*300)}
</script>
</body>
</html>
