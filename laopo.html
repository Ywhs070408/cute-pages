<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天也在想老婆">
<title>今天也在想老婆 🐰</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fdf2f8 0%,#fce7f3 20%,#fbcfe8 45%,#f9a8d4 70%,#f472b6 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  .heart-bg{position:absolute;font-size:20px;opacity:.35;animation:floatUp 9s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }
  .flower-bg{position:absolute;font-size:18px;opacity:.2;animation:floatFlower 14s linear infinite;pointer-events:none}
  @keyframes floatFlower{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.22}
    90%{opacity:.18}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }

  .title{
    font-size:23px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 12px rgba(236,72,153,.4);
    margin-bottom:6px;z-index:2;letter-spacing:1px;
  }
  .subtitle{
    font-size:13px;color:rgba(255,255,255,.9);margin-bottom:20px;z-index:2;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }

  .rabbit-container{
    position:relative;z-index:2;margin-bottom:30px;
    animation:idle 3s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes idle{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  .rabbit-container.happy{animation:happyJump .5s ease 3}
  @keyframes happyJump{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-26px) rotate(-5deg) scale(1.05)}
    75%{transform:translateY(-26px) rotate(5deg) scale(1.05)}
  }
  .rabbit-svg{width:200px;height:240px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}

  /* ear animations */
  #earLeft{transform-origin:85px 75px;animation:earWiggleL 2.5s ease-in-out infinite}
  @keyframes earWiggleL{
    0%,100%{transform:rotate(0)}
    50%{transform:rotate(-8deg)}
  }
  #earRight{transform-origin:135px 75px;animation:earWiggleR 2.5s ease-in-out infinite}
  @keyframes earWiggleR{
    0%,100%{transform:rotate(0)}
    50%{transform:rotate(8deg)}
  }
  .rabbit-container.happy #earLeft{animation:earFastL .3s ease infinite}
  @keyframes earFastL{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(10deg)}}
  .rabbit-container.happy #earRight{animation:earFastR .3s ease infinite}
  @keyframes earFastR{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-10deg)}}

  /* tail wag */
  #rabbitTail{transform-origin:155px 175px;animation:tailWag 1.8s ease-in-out infinite}
  @keyframes tailWag{
    0%,100%{transform:rotate(-12deg)}
    50%{transform:rotate(15deg)}
  }
  .rabbit-container.happy #rabbitTail{animation:tailFast .25s ease infinite}
  @keyframes tailFast{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(35deg)}}

  .miss-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;
    padding:16px 50px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(236,72,153,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .counter{
    margin-top:18px;font-size:13px;color:rgba(255,255,255,.85);
    z-index:2;text-shadow:0 1px 4px rgba(236,72,153,.3);
  }

  .popup-overlay{
    position:fixed;inset:0;background:rgba(131,24,67,.25);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#fdf2f8);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(236,72,153,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #fbcfe8;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:20px;font-weight:800;color:#ec4899;margin-bottom:10px}
  .popup-text{font-size:15px;color:#9d174d;line-height:1.6;margin-bottom:8px}
  .popup-sub{font-size:13px;color:#be185d;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(236,72,153,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}

  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }
  .footer{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.6);z-index:2}
</style>
</head>
<body>
<div id="heartsBg"></div>
<div id="flowersBg"></div>

<div class="title">今天也在想老婆</div>
<div class="subtitle">🐰 点点小兔告诉老婆你想她啦～</div>

<div class="rabbit-container" id="rabbitContainer" onclick="petRabbit()">
  <svg class="rabbit-svg" viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg">
    <!-- soft halo glow -->
    <defs>
      <radialGradient id="bodyGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fef3c7"/>
        <stop offset="60%" stop-color="#fde68a"/>
        <stop offset="100%" stop-color="#fbbf24"/>
      </radialGradient>
      <radialGradient id="earInnerGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fbcfe8"/>
        <stop offset="100%" stop-color="#f9a8d4"/>
      </radialGradient>
    </defs>

    <!-- ears (small triangle-ish) -->
    <g id="earLeft">
      <ellipse cx="85" cy="50" rx="14" ry="28" fill="url(#bodyGrad)" stroke="#d97706" stroke-width="1.5" opacity=".9"/>
      <ellipse cx="85" cy="56" rx="7" ry="18" fill="url(#earInnerGrad)"/>
    </g>
    <g id="earRight">
      <ellipse cx="135" cy="50" rx="14" ry="28" fill="url(#bodyGrad)" stroke="#d97706" stroke-width="1.5" opacity=".9"/>
      <ellipse cx="135" cy="56" rx="7" ry="18" fill="url(#earInnerGrad)"/>
    </g>

    <!-- tail (small pom behind) -->
    <g id="rabbitTail">
      <circle cx="155" cy="180" r="13" fill="url(#bodyGrad)" stroke="#d97706" stroke-width="1"/>
      <circle cx="152" cy="177" r="4" fill="#fef3c7" opacity=".6"/>
    </g>

    <!-- big round body -->
    <ellipse cx="110" cy="180" rx="68" ry="55" fill="url(#bodyGrad)" stroke="#d97706" stroke-width="1.5"/>

    <!-- head (round, big) -->
    <circle cx="110" cy="115" r="52" fill="url(#bodyGrad)" stroke="#d97706" stroke-width="1.5"/>

    <!-- body texture lines (subtle fur) -->
    <path d="M85 165 Q90 170 88 178" stroke="#d97706" stroke-width="1" fill="none" opacity=".3"/>
    <path d="M130 165 Q125 170 127 178" stroke="#d97706" stroke-width="1" fill="none" opacity=".3"/>
    <path d="M110 175 Q105 180 108 195" stroke="#d97706" stroke-width="1" fill="none" opacity=".25"/>

    <!-- blue striped scarf -->
    <g id="scarf">
      <!-- scarf main wrap -->
      <path d="M70 145 Q110 165 150 145 L150 162 Q110 182 70 162 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- scarf stripes -->
      <path d="M82 152 Q110 168 138 152" stroke="#3b82f6" stroke-width="1" fill="none" opacity=".5"/>
      <path d="M78 158 Q110 175 142 158" stroke="#3b82f6" stroke-width="1" fill="none" opacity=".5"/>
      <!-- bow knot -->
      <ellipse cx="110" cy="170" rx="8" ry="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
      <!-- bow tails -->
      <path d="M105 172 Q95 195 88 200 Q92 198 100 192 Q108 185 110 175" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
      <path d="M115 172 Q125 195 132 200 Q128 198 120 192 Q112 185 110 175" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
    </g>

    <!-- eyes (small black) -->
    <g id="eyesNormal">
      <ellipse cx="92" cy="115" rx="4" ry="5" fill="#1f2937"/>
      <ellipse cx="128" cy="115" rx="4" ry="5" fill="#1f2937"/>
      <circle cx="93.5" cy="113" r="1.5" fill="#fff"/>
      <circle cx="129.5" cy="113" r="1.5" fill="#fff"/>
    </g>
    <!-- happy eyes (^_^) -->
    <g id="eyesHappy" style="display:none">
      <path d="M86 116 Q92 109 98 116" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M122 116 Q128 109 134 116" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- nose (small triangle) -->
    <path d="M107 128 L113 128 L110 132 Z" fill="#9d174d"/>

    <!-- mouth (small) -->
    <path id="mouthNormal" d="M110 132 Q107 135 104 134 M110 132 Q113 135 116 134" stroke="#9d174d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- happy mouth (open with tongue) -->
    <path id="mouthHappy" d="M104 132 Q110 142 116 132 Q114 138 110 138 Q106 138 104 132" fill="#fb7185" stroke="#9d174d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>

    <!-- whiskers (subtle) -->
    <line x1="65" y1="130" x2="40" y2="128" stroke="#9d174d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
    <line x1="65" y1="135" x2="40" y2="138" stroke="#9d174d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
    <line x1="155" y1="130" x2="180" y2="128" stroke="#9d174d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
    <line x1="155" y1="135" x2="180" y2="138" stroke="#9d174d" stroke-width="1" stroke-linecap="round" opacity=".6"/>

    <!-- blush -->
    <ellipse cx="78" cy="128" rx="8" ry="5" fill="#fb7185" opacity=".4"/>
    <ellipse cx="142" cy="128" rx="8" ry="5" fill="#fb7185" opacity=".4"/>

    <!-- little tongue (when happy) -->
    <ellipse id="tongue" cx="110" cy="135" rx="3" ry="2" fill="#fb7185" style="display:none"/>
  </svg>
</div>

<button class="miss-btn" onclick="missHer()">
  <span class="btn-heart">💗</span>想了
</button>

<div class="counter" id="counter">今天想了 0 次</div>

<div class="footer"> made with 💕 for 逍乂 & 老婆 </div>

<!-- popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-emoji">🐰💗</div>
    <div class="popup-title">逍乂也很想你！爱你老婆</div>
    <div class="popup-text">小兔说：<br>"收到你的想念啦！<br>摇摇尾巴动动耳朵，逍乂也一直在想你哦！爱你老婆！"</div>
    <div class="popup-sub">💕 心意已传达 💕</div>
    <button class="popup-btn" onclick="closePopup()">我也爱你呀～</button>
  </div>
</div>

<script>
let count=Number(localStorage.getItem('laopoMissCount')||0);
let lastDate=localStorage.getItem('laopoMissDate')||'';
const today=new Date().toDateString();
if(lastDate!==today){count=0;localStorage.setItem('xhMissDate',today)}
updateCounter();

function updateCounter(){
  document.getElementById('counter').textContent='今天想了 '+count+' 次';
}

function missHer(){
  count++;
  localStorage.setItem('laopoMissCount',count);
  updateCounter();
  makeHappy();
  createSparkles();
  setTimeout(()=>{document.getElementById('popupOverlay').classList.add('show')},350);
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
  setTimeout(resetFace,300);
}

function petRabbit(){
  makeHappy();
  createSparkles();
}

let happyTimer=null;
function makeHappy(){
  const rabbit=document.getElementById('rabbitContainer');
  rabbit.classList.add('happy');
  document.getElementById('eyesNormal').style.display='none';
  document.getElementById('eyesHappy').style.display='';
  document.getElementById('mouthNormal').style.display='none';
  document.getElementById('mouthHappy').style.display='';
  document.getElementById('tongue').style.display='';
  clearTimeout(happyTimer);
  happyTimer=setTimeout(()=>{
    rabbit.classList.remove('happy');
    if(!document.getElementById('popupOverlay').classList.contains('show'))resetFace();
  },2000);
}
function resetFace(){
  document.getElementById('eyesNormal').style.display='';
  document.getElementById('eyesHappy').style.display='none';
  document.getElementById('mouthNormal').style.display='';
  document.getElementById('mouthHappy').style.display='none';
  document.getElementById('tongue').style.display='none';
}

function createSparkles(){
  const emojis=['💗','✨','💖','🌸','💫','🐰','💕','🌷'];
  const rabbit=document.getElementById('rabbitContainer');
  const rect=rabbit.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*170)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*120)+'px';
    s.style.animationDelay=(i*0.07)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

function createFloatingHeart(){
  const h=document.createElement('div');
  h.className='heart-bg';
  const emojis=['💗','💕','✨','🌸','💫','🐰','🌷'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';
  h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);
  setTimeout(()=>h.remove(),10000);
}

function createFloatingFlower(){
  const f=document.createElement('div');
  f.className='flower-bg';
  f.textContent='🌸';
  f.style.left=Math.random()*100+'%';
  f.style.fontSize=(12+Math.random()*10)+'px';
  f.style.animationDuration=(10+Math.random()*6)+'s';
  document.getElementById('flowersBg').appendChild(f);
  setTimeout(()=>f.remove(),16000);
}

setInterval(createFloatingHeart,650);
setInterval(createFloatingFlower,1000);
for(let i=0;i<5;i++){setTimeout(createFloatingHeart,i*200);setTimeout(createFloatingFlower,i*400)}
</script>
</body>
</html>
