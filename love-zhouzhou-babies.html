<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="谁是我最爱的宝贝们">
<title>谁是我最爱的宝贝们 🐾</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fff5f7 0%,#fce7f0 20%,#fbcfe8 45%,#f9a8d4 70%,#f472b6 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  .heart-bg{position:absolute;font-size:20px;opacity:.35;animation:floatUp 9s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }
  .title{
    font-size:22px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 12px rgba(236,72,153,.4);
    margin-bottom:4px;z-index:2;letter-spacing:2px;
  }
  .subtitle{
    font-size:13px;color:rgba(255,255,255,.9);margin-bottom:16px;z-index:2;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }
  .animal-container{
    position:relative;z-index:2;margin-bottom:24px;
    animation:idle 3s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes idle{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-4px) rotate(1deg)}
    75%{transform:translateY(-4px) rotate(-1deg)}
  }
  .animal-container.happy{animation:happyShake .4s ease 4}
  @keyframes happyShake{
    0%,100%{transform:translateX(0) rotate(0) scale(1)}
    25%{transform:translateX(-15px) rotate(-8deg) scale(1.06)}
    75%{transform:translateX(15px) rotate(8deg) scale(1.06)}
  }
  .animal-svg{width:220px;height:220px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}
  #earLeft,#earRight{animation:earWiggle 2.5s ease-in-out infinite}
  @keyframes earWiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
  .animal-container.happy #earLeft,.animal-container.happy #earRight{animation:earFast .25s ease infinite}
  @keyframes earFast{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
  #animalTail{animation:tailWag 1.8s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(20deg)}}
  .animal-container.happy #animalTail{animation:tailFast .2s ease infinite}
  @keyframes tailFast{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(40deg)}}

  .animal-name{
    text-align:center;z-index:2;margin-bottom:14px;
    font-size:16px;color:#fff;font-weight:700;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
    min-height:24px;
  }
  .miss-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;
    padding:16px 52px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(236,72,153,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .shuffle-btn{
    background:rgba(255,255,255,.3);color:#fff;border:1.5px solid rgba(255,255,255,.5);
    padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    z-index:2;margin-top:12px;font-family:inherit;
    backdrop-filter:blur(4px);
  }
  .shuffle-btn:active{transform:scale(.95)}
  .counter{
    margin-top:14px;font-size:13px;color:rgba(255,255,255,.85);
    z-index:2;text-shadow:0 1px 4px rgba(236,72,153,.3);
  }
  .popup-overlay{
    position:fixed;inset:0;background:rgba(131,24,67,.25);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#fdf2f8);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(236,72,153,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #fbcfe8;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:22px;font-weight:800;color:#ec4899;margin-bottom:10px}
  .popup-text{font-size:16px;color:#9d174d;line-height:1.6;margin-bottom:8px;font-weight:600}
  .popup-sub{font-size:13px;color:#be185d;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(236,72,153,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}
  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }
  .footer{position:absolute;bottom:18px;font-size:11px;color:rgba(255,255,255,.6);z-index:2}
</style>

<body>

<div class="subtitle">🐾 点点小动物看看是谁在想你～</div>

<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">

  </div>
</div>

function renderAnimal(){
  const a=animals[currentAnimal];
  $('#animalSvg').innerHTML=a.svg();
  $('#animalName').textContent=a.name;
}

function shuffleAnimal(){
  currentAnimal=Math.floor(Math.random()*animals.length);
  renderAnimal();
  // little bounce on shuffle
  const c=$('#animalContainer');
  c.style.animation='none';void c.offsetWidth;c.style.animation='idle 3s ease-in-out infinite';
}

function updateCounter(){$('#counter').textContent='今天想了 '+count+' 次'}

function missAnimal(){
  count++;localStorage.setItem('babiesMissCount',count);updateCounter();
  makeHappy();createSparkles();
  const a=animals[currentAnimal];
  $('#popupEmoji').textContent=a.emoji+'💗';
  $('#popupTitle').textContent=a.popupTitle;
  $('#popupText').textContent=a.popup;
  setTimeout(()=>{$('#popupOverlay').classList.add('show')},350);
}

function closePopup(){$('#popupOverlay').classList.remove('show');setTimeout(resetFace,300)}

function petAnimal(){makeHappy();createSparkles()}

let happyTimer=null;
function makeHappy(){
  const c=$('#animalContainer');c.classList.add('happy');
  const en=$('#animalContainer').querySelector('#eyesNormal');
  const eh=$('#animalContainer').querySelector('#eyesHappy');
  const mn=$('#animalContainer').querySelector('#mouthNormal');
  const mh=$('#animalContainer').querySelector('#mouthHappy');
  if(en)en.style.display='none';if(eh)eh.style.display='';
  if(mn)mn.style.display='none';if(mh)mh.style.display='';
  clearTimeout(happyTimer);
  happyTimer=setTimeout(()=>{
    c.classList.remove('happy');
    if(!$('#popupOverlay').classList.contains('show'))resetFace();
  },2000);
}
function resetFace(){
  const en=$('#animalContainer').querySelector('#eyesNormal');
  const eh=$('#animalContainer').querySelector('#eyesHappy');
  const mn=$('#animalContainer').querySelector('#mouthNormal');
  const mh=$('#animalContainer').querySelector('#mouthHappy');
  if(en)en.style.display='';if(eh)eh.style.display='none';
  if(mn)mn.style.display='';if(mh)eh.style.display='none';
  if(mh)mh.style.display='none';
}

function createSparkles(){
  const emojis=['💗','✨','💖','🌸','💫','🐾','💕','🌷'];
  const c=$('#animalContainer');const rect=c.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*180)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*120)+'px';
    s.style.animationDelay=(i*0.07)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),1500);
  }
}

function createFloatingHeart(){
  const h=document.createElement('div');h.className='heart-bg';
  const emojis=['💗','💕','✨','🌸','💫','🐾','🌷'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);setTimeout(()=>h.remove(),10000);
}
function $(s){return document.querySelector(s)}

setInterval(createFloatingHeart,650);

// random animal on load
currentAnimal=Math.floor(Math.random()*animals.length);
renderAnimal();
</script>
