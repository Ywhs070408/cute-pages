<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="闺蜜今天也想小炮">
<title>闺蜜今天也想小炮 🐑</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fce7f3 0%,#fbcfe8 30%,#f9a8d4 60%,#f472b6 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  /* floating hearts bg */
  .heart-bg{position:absolute;font-size:20px;opacity:.3;animation:floatUp 8s linear infinite;pointer-events:none}
  @keyframes floatUp{
    0%{transform:translateY(100vh) rotate(0);opacity:0}
    10%{opacity:.4}
    90%{opacity:.3}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0}
  }

  .title{
    font-size:22px;font-weight:800;color:#fff;text-align:center;
    text-shadow:0 2px 10px rgba(236,72,153,.4);
    margin-bottom:6px;z-index:2;letter-spacing:1px;
  }
  .subtitle{
    font-size:13px;color:rgba(255,255,255,.85);margin-bottom:30px;z-index:2;
    text-shadow:0 1px 6px rgba(236,72,153,.3);
  }

  /* sheep scene */
  .sheep-container{
    position:relative;z-index:2;margin-bottom:40px;
    animation:bounce 2s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }
  .sheep-container.clicked{animation:happyBounce .5s ease 3}
  @keyframes happyBounce{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-20px) rotate(-5deg)}
    75%{transform:translateY(-20px) rotate(5deg)}
  }

  .sheep-svg{width:220px;height:220px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.15))}

  /* button */
  .miss-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;
    padding:16px 48px;border-radius:30px;
    font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(236,72,153,.4);
    transition:.2s;z-index:2;letter-spacing:2px;
    font-family:inherit;
  }
  .miss-btn:hover{filter:brightness(1.08)}
  .miss-btn:active{transform:scale(.93)}
  .miss-btn .btn-heart{display:inline-block;margin-right:6px;animation:beat 1s ease infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

  .counter{
    margin-top:20px;font-size:13px;color:rgba(255,255,255,.8);
    z-index:2;text-shadow:0 1px 4px rgba(236,72,153,.3);
  }

  /* popup */
  .popup-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;backdrop-filter:blur(6px);
  }
  .popup-overlay.show{opacity:1;pointer-events:auto}
  .popup{
    background:linear-gradient(180deg,#fff,#fdf2f8);
    border-radius:28px;padding:36px 30px 30px;
    text-align:center;max-width:320px;width:85%;
    box-shadow:0 20px 50px rgba(236,72,153,.3);
    transform:scale(.7) translateY(20px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #fbcfe8;
  }
  .popup-overlay.show .popup{transform:scale(1) translateY(0)}
  .popup-emoji{font-size:60px;margin-bottom:12px;animation:popIn .5s ease}
  @keyframes popIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .popup-title{font-size:20px;font-weight:800;color:#ec4899;margin-bottom:10px}
  .popup-text{font-size:15px;color:#9d174d;line-height:1.6;margin-bottom:8px}
  .popup-sub{font-size:13px;color:#be185d;opacity:.7;margin-bottom:20px}
  .popup-btn{
    background:linear-gradient(135deg,#f472b6,#ec4899);
    color:#fff;border:none;padding:12px 36px;border-radius:25px;
    font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(236,72,153,.35);transition:.2s;
    font-family:inherit;
  }
  .popup-btn:active{transform:scale(.95)}

  /* sparkles */
  .sparkle{
    position:absolute;font-size:24px;pointer-events:none;
    animation:sparkleAnim 1.2s ease-out forwards;z-index:50;
  }
  @keyframes sparkleAnim{
    0%{opacity:1;transform:scale(0) rotate(0)}
    50%{opacity:1;transform:scale(1.5) rotate(180deg)}
    100%{opacity:0;transform:scale(.5) rotate(360deg) translateY(-60px)}
  }

  .footer{
    position:absolute;bottom:20px;font-size:11px;
    color:rgba(255,255,255,.6);z-index:2;
  }
</style>
</head>
<body>

<!-- floating hearts -->
<div id="heartsBg"></div>

<div class="title">闺蜜今天也想小炮</div>
<div class="subtitle">🐑 点点小羊告诉它你想它啦～</div>

<!-- Sheep with cannon -->
<div class="sheep-container" id="sheepContainer" onclick="petSheep()">
  <svg class="sheep-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <!-- cloud puff (body) -->
    <ellipse cx="110" cy="140" rx="65" ry="50" fill="#fff"/>
    <circle cx="60" cy="120" r="22" fill="#fff"/>
    <circle cx="160" cy="120" r="22" fill="#fff"/>
    <circle cx="100" cy="95" r="25" fill="#fff"/>
    <circle cx="135" cy="95" r="22" fill="#fff"/>
    <!-- legs -->
    <rect x="75" y="175" width="10" height="25" rx="5" fill="#9ca3af"/>
    <rect x="135" y="175" width="10" height="25" rx="5" fill="#9ca3af"/>
    <rect x="95" y="178" width="9" height="22" rx="4" fill="#d1d5db"/>
    <rect x="118" y="178" width="9" height="22" rx="4" fill="#d1d5db"/>
    <!-- face -->
    <ellipse cx="110" cy="115" rx="30" ry="28" fill="#e5e7eb"/>
    <!-- ears -->
    <ellipse cx="82" cy="100" rx="10" ry="6" fill="#d1d5db" transform="rotate(-30 82 100)"/>
    <ellipse cx="138" cy="100" rx="10" ry="6" fill="#d1d5db" transform="rotate(30 138 100)"/>
    <!-- eyes -->
    <ellipse cx="100" cy="113" rx="4" ry="5" fill="#1f2937"/>
    <ellipse cx="120" cy="113" rx="4" ry="5" fill="#1f2937"/>
    <circle cx="101.5" cy="111" r="1.5" fill="#fff"/>
    <circle cx="121.5" cy="111" r="1.5" fill="#fff"/>
    <!-- cheeks -->
    <circle cx="90" cy="122" r="6" fill="#fbcfe8" opacity=".7"/>
    <circle cx="130" cy="122" r="6" fill="#fbcfe8" opacity=".7"/>
    <!-- mouth -->
    <path d="M105 125 Q110 130 115 125" stroke="#9d174d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- bow on head -->
    <path d="M110 85 L100 78 L100 92 Z" fill="#f472b6"/>
    <path d="M110 85 L120 78 L120 92 Z" fill="#f472b6"/>
    <circle cx="110" cy="85" r="4" fill="#ec4899"/>

    <!-- mini cannon held by sheep -->
    <rect x="150" y="145" width="40" height="16" rx="8" fill="#6b7280" transform="rotate(-15 150 145)"/>
    <rect x="148" y="142" width="10" height="22" rx="4" fill="#4b5563" transform="rotate(-15 150 145)"/>
    <circle cx="188" cy="138" r="7" fill="#f59e0b" opacity=".8"/>
    <circle cx="188" cy="138" r="4" fill="#fbbf24"/>
    <!-- sparkle on cannon -->
    <text x="195" y="130" font-size="14" fill="#fbbf24">✨</text>
  </svg>
</div>

<button class="miss-btn" onclick="missHim()">
  <span class="btn-heart">💗</span>想了
</button>

<div class="counter" id="counter">今天想了 0 次</div>

<div class="footer"> made with 💕 for 闺蜜 & 小炮 </div>

<!-- popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-emoji">🐑💕</div>
    <div class="popup-title">小炮也很想你！</div>
    <div class="popup-text">小炮说：<br>"收到你的想念啦～<br>我也超级想你哒！"</div>
    <div class="popup-sub">🎀 心意已传达 🎀</div>
    <button class="popup-btn" onclick="closePopup()">好开心～</button>
  </div>
</div>

<script>
let count=Number(localStorage.getItem('missCount')||0);
let lastDate=localStorage.getItem('missDate')||'';
const today=new Date().toDateString();
if(lastDate!==today){count=0;localStorage.setItem('missDate',today)}
updateCounter();

function updateCounter(){
  document.getElementById('counter').textContent='今天想了 '+count+' 次';
}

function missHim(){
  count++;
  localStorage.setItem('missCount',count);
  updateCounter();
  // sheep happy bounce
  const sheep=document.getElementById('sheepContainer');
  sheep.classList.add('clicked');
  setTimeout(()=>sheep.classList.remove('clicked'),1500);
  // sparkles
  createSparkles();
  // show popup after a tiny delay
  setTimeout(()=>{
    document.getElementById('popupOverlay').classList.add('show');
  },300);
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('show');
}

function petSheep(){
  // petting the sheep also creates sparkles
  createSparkles();
  const sheep=document.getElementById('sheepContainer');
  sheep.classList.add('clicked');
  setTimeout(()=>sheep.classList.remove('clicked'),1500);
}

function createSparkles(){
  const emojis=['💕','✨','💖','⭐','🌸','💫'];
  const sheep=document.getElementById('sheepContainer');
  const rect=sheep.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2+(Math.random()-0.5)*160)+'px';
    s.style.top=(rect.top+rect.height/2+(Math.random()-0.5)*100)+'px';
    s.style.animationDelay=(i*0.08)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}

// floating hearts background
function createFloatingHeart(){
  const h=document.createElement('div');
  h.className='heart-bg';
  const emojis=['💗','💕','💖','💝','🌸','✨'];
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'%';
  h.style.fontSize=(14+Math.random()*16)+'px';
  h.style.animationDuration=(6+Math.random()*4)+'s';
  document.getElementById('heartsBg').appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(createFloatingHeart,800);
for(let i=0;i<5;i++)setTimeout(createFloatingHeart,i*200);
</script>
</body>
</html>
